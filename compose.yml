services:
  cloudsync:
    image: x4bnet/boostssh-cloudsync:${CLOUDSYNC_TAG:-latest}
    environment:
      DATABASE_PATH: /data/cloudsync.sqlite
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random characters}
      PORT: 3000
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      AUTH_WINDOW_SECONDS: ${AUTH_WINDOW_SECONDS:-900}
      AUTH_IP_LIMIT: ${AUTH_IP_LIMIT:-100}
      AUTH_ACCOUNT_LIMIT: ${AUTH_ACCOUNT_LIMIT:-10}
      PASSWORD_HASH_CONCURRENCY: ${PASSWORD_HASH_CONCURRENCY:-2}
      USER_REQUESTS_PER_MINUTE: ${USER_REQUESTS_PER_MINUTE:-60}
      MAX_USERS: ${MAX_USERS:-100}
      MAX_USER_STORAGE_BYTES: ${MAX_USER_STORAGE_BYTES:-52428800}
      MAX_SNAPSHOT_STORAGE_BYTES: ${MAX_SNAPSHOT_STORAGE_BYTES:-536870912}
      MAX_DATABASE_BYTES: ${MAX_DATABASE_BYTES:-805306368}
      MAX_UPLOAD_RECEIPTS_PER_USER: ${MAX_UPLOAD_RECEIPTS_PER_USER:-10000}
      MAX_DEVICES_PER_USER: ${MAX_DEVICES_PER_USER:-32}
      MAX_REFRESH_TOKENS_PER_USER: ${MAX_REFRESH_TOKENS_PER_USER:-10000}
      MAX_AUDIT_EVENTS: ${MAX_AUDIT_EVENTS:-10000}
      AUDIT_RETENTION_SECONDS: ${AUDIT_RETENTION_SECONDS:-2592000}
      MAX_UPLOAD_AGE_SECONDS: ${MAX_UPLOAD_AGE_SECONDS:-2592000}
    volumes:
      - cloudsync-data:/data
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  cloudsync-data:
