name: Workflow validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep this independent so it can report errors in workflows GitHub cannot start.
jobs:
  actionlint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Check workflow syntax and expression contexts
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=
