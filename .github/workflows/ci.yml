name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudsync:
    name: CloudSync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'x4bnet' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Test Docker Hub repository provisioning
        run: node --test scripts/test/prepare-cloudsync-repository.test.mjs
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.repository == 'X4BNet/boostssh-cloudsync'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: x4bnet/boostssh-cloudsync
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=git-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,prefix=branch-,enable=${{ github.ref_name != github.event.repository.default_branch }}
            type=ref,event=tag
            type=ref,event=pr
      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test container and persistent storage
        env:
          IMAGE: x4bnet/boostssh-cloudsync:git-${{ github.sha }}
        run: bash scripts/test-cloudsync-container.sh
      - name: Prepare public Docker Hub repository
        if: github.event_name != 'pull_request' && github.repository == 'X4BNet/boostssh-cloudsync'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: node scripts/prepare-cloudsync-repository.mjs
      - name: Publish tested container
        if: github.event_name != 'pull_request' && github.repository == 'X4BNet/boostssh-cloudsync'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
