apiVersion: v1
kind: Service
metadata:
  name: cloudsync-headless
  labels:
    app.kubernetes.io/name: cloudsync
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cloudsync
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: cloudsync
  labels:
    app.kubernetes.io/name: cloudsync
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudsync
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloudsync
  labels:
    app.kubernetes.io/name: cloudsync
spec:
  # SQLite supports one server instance. Do not increase this replica count.
  replicas: 1
  serviceName: cloudsync-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudsync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudsync
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data-directory
          image: x4bnet/boostssh-cloudsync:latest
          imagePullPolicy: Always
          command: ["chown", "-R", "1000:1000", "/data"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: cloudsync
          image: x4bnet/boostssh-cloudsync:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_PATH
              value: /data/cloudsync.sqlite
            - name: REGISTRATION_ENABLED
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudsync
                  key: JWT_SECRET
          startupProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
